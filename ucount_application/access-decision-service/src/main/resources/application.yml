server:
  port: 8082

spring:
  application:
    name: access-decision-service

  datasource:
    url: jdbc:h2:mem:ucount_stage2_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ucount-access-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# ControlM ACR (Annual Certificate Repair) Schedule Configuration
acr:
  batch:
    cron: "0 0 2 * * ?" # Runs daily at 2:00 AM
    retention-days: 30
